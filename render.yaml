services:
  - type: web
    name: bear-bunny-ai-studio
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        value: https://api.openai.com/v1
      - key: TEXT_MODEL
        value: gpt-4o-mini
      - key: TTS_MODEL
        value: gpt-4o-mini-tts
      - key: TTS_VOICE
        value: coral
      - key: COMFYUI_URL
        sync: false
      - key: WAN_PROMPT_NODE_ID
        sync: false
