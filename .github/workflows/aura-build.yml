name: Build AURA Music APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'aura-project/**'
      - '.github/workflows/aura-build.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        working-directory: aura-project
        run: gradle assembleDebug --stacktrace
      - name: Verify APK
        run: |
          APK="aura-project/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          file "$APK"
          unzip -t "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 8
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: AURA-Music-debug-apk
          path: aura-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
